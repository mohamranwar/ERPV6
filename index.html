<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supply Chain Planner</title>
    <!-- No webfont CDN link here, deliberately.

         This page used to pull Inter and JetBrains Mono from Google Fonts.
         Two problems with that:

         1. It fails behind the corporate FortiGate proxy, so the app fell
            back to a system face for the people who actually use it.
         2. It loaded AFTER the app stylesheet and defined a real "Inter"
            face, which quietly won over the self-hosted IBM Plex the theme
            asks for. The tokens were correct, the fonts were downloaded and
            committed, and the UI still rendered in the wrong typeface --
            with nothing in the CSS to explain why.

         Every face is now self-hosted and declared with @font-face in
         src/index.css, served from /fonts. No external request, no proxy
         dependency, and nothing that can override the theme. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
